name: Mobile app CI

on:
  push:
    paths: ['mobile-app/**', '.github/workflows/mobile-ci.yml']
  pull_request:
    branches: [main]
    paths: ['mobile-app/**', '.github/workflows/mobile-ci.yml']
  workflow_dispatch:
    inputs:
      api_base_url:
        description: 'API origin the app talks to'
        type: string
        default: https://ashesi-graduation-tracker.onrender.com

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.47.9
  API_BASE_URL: ${{ inputs.api_base_url || 'https://ashesi-graduation-tracker.onrender.com' }}

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - name: Analyze
        run: flutter analyze
      - name: Tests
        run: flutter test
      - name: Build Android APK
        # Signed with the debug key for testing; store releases need the upload key (docs/08-deployment/mobile-release-guide.md).
        run: flutter build apk --release --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: graduation-tracker-android
          path: mobile-app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    # macOS runners are costly, so the iOS build runs only when started by hand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Build iOS app without code signing
        run: flutter build ios --release --no-codesign --dart-define=API_BASE_URL=${{ env.API_BASE_URL }}
